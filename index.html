<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STUDY FLOW">
<title>STUDY FLOW</title>
<style>
:root{--bg:#f6f4ef;--paper:#fff;--ink:#252525;--muted:#858585;--line:#e9e6df;--accent:#343c54;--shadow:0 8px 26px #28231a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;transition:background .2s ease}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px 22px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#343c54;color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}
h1{font-size:21px;letter-spacing:1.4px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 13px;font-size:13px;color:#343434}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{padding:6px 9px;font-size:11px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;gap:10px}.monthnav{display:flex;align-items:center;gap:12px}.monthnav strong{font-size:22px;min-width:130px}.navbtn{border:0;background:white;border-radius:10px;width:34px;height:34px;font-size:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.calendar{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{text-align:center;padding:12px 3px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.weekday:first-child{color:#d16b68}
.day{min-height:122px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;position:relative;min-width:0;cursor:pointer}.day:nth-child(7n){border-right:0}.day.other{background:#faf9f6}.day.today .num{background:var(--accent);color:white}.day.sunday .num{color:#d16b68}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-bottom:5px}.other .num{color:#b8b5ae}
.rest{position:absolute;right:6px;top:10px;color:#d16b68;font-size:10px;background:#fff1ef;border-radius:6px;padding:2px 5px}.task{position:relative;margin:3px 0;padding:5px 18px 5px 7px;border-radius:6px;font-size:10px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#252525;touch-action:pan-y;user-select:none;cursor:grab;border-left:3px solid var(--c)}
.task.done{opacity:.58;text-decoration:line-through}.task .grip{position:absolute;right:0;top:0;width:15px;height:100%;cursor:ew-resize;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;touch-action:none}.task.dragging{opacity:.35}.day.drop{background:#f0f2f8;outline:2px dashed #66708c;outline-offset:-3px}
.side{display:flex;flex-direction:column;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:14px;margin:0 0 12px}.stat{display:flex;justify-content:space-between;font-size:13px;margin:9px 0}.stat b{font-size:15px}.hint{font-size:11px;color:var(--muted);line-height:1.65}.empty{font-size:12px;color:#aaa;text-align:center;padding:14px 0}
.bookrow,.savedrow{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0;min-width:0}.bookrow .name,.savedrow .desc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bookrow button{margin-left:auto;border:0;background:#f5f3ef;border-radius:7px;padding:5px 8px;font-size:11px;flex-shrink:0}
.savedrow{align-items:center;border-top:1px solid #f0eee9;padding-top:9px}.savedrow .desc{flex:1;font-weight:600}.savedrow .savedactions{display:flex;gap:4px;flex-shrink:0}
.panel-foot{border-top:1px dashed #f0eee9;margin-top:10px;padding-top:8px;text-align:center}.panel-foot button{width:100%;border:0;background:#faf9f6;border-radius:8px;padding:6px 0;font-size:11px;color:#666}
.panel-foot button:hover{background:#f0eee9}
.modalback{position:fixed;inset:0;background:#17171766;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:white;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px;font-size:18px}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.field{min-width:0}.field input,.field select{min-width:0;max-width:100%;display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.field input[type="date"],.field input[type="number"]{min-height:42px}#duration{text-align:center}.checkrow{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:10px;flex-wrap:wrap}
.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.rightbuttons{display:flex;gap:7px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#343c54;color:white;border-radius:10px;padding:11px 16px;font-size:12px;display:none;z-index:50;box-shadow:0 5px 20px #0002}
.goalrow{border-top:1px solid #f0eee9;padding:10px 0}.goalhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.goalbar{height:7px;background:#eee;border-radius:10px;overflow:hidden;margin:9px 0 5px}.goalbar span{display:block;height:100%;background:var(--goal-color,#7183b5);border-radius:10px}.goalmeta{font-size:10px;color:var(--muted);line-height:1.6}.monthbook{padding:8px 0;border-top:1px solid #f0eee9;font-size:12px}.monthbook small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.row-actions{display:flex;gap:4px;align-items:center}.tiny{border:0;background:#f4f2ee;border-radius:6px;padding:4px 7px;font-size:10px;color:#666}
.dateitem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.dateitem .row-actions{flex-shrink:0}.done-date{color:#6d9b79}.muted-date{color:#aaa}
#bookChoices{display:none;position:absolute;z-index:5;background:white;border:1px solid var(--line);border-radius:10px;max-height:150px;overflow:auto;width:100%;box-shadow:0 5px 18px #0001}#bookChoices.show{display:block}.choice{padding:9px 11px;font-size:12px;cursor:pointer}.choice:hover{background:#f6f4ef}

/* 설정 모달 전용 스타일 */
.settings-section{border-top:1px solid var(--line);padding:14px 0}.settings-section h3{font-size:13px;margin:0 0 10px;color:#343c54}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}
.setting-panel-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px}
.setting-panel-item .panel-title{font-size:13px;font-weight:600;flex:1}
.setting-color{width:54px;height:36px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
@media(max-width:760px){.app{padding:15px 12px 35px}.layout{grid-template-columns:1fr}.side{display:flex}.day{min-height:85px;padding:5px 3px}.task{font-size:9px;padding:4px 13px 4px 5px}.monthnav strong{font-size:18px;min-width:110px}.formgrid{gap:8px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">SF</div><div><h1>STUDY FLOW</h1><div class="sub">나만의 공부 일정 관리</div></div></div>
  <div class="actions">
    <button class="btn small" id="undoBtn">↶ 되돌리기</button>
    <button class="btn small" id="redoBtn">↷ 다시 실행</button>
    <button class="btn small" id="settingsBtn">⚙ 설정</button>
    <button class="btn small" id="backup">
