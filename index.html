<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STUDY FLOW">
<title>STUDY FLOW</title>
<style>
:root{--bg:#f6f4ef;--paper:#fff;--ink:#252525;--muted:#858585;--line:#e9e6df;--accent:#343c54;--shadow:0 8px 26px #28231a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:22px 22px 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:#343c54;color:white;display:grid;place-items:center;font-weight:800;letter-spacing:-1px}
h1{font-size:21px;letter-spacing:1.4px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:white;border-radius:11px;padding:10px 13px;font-size:13px;color:#343434}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.small{padding:6px 9px;font-size:11px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 12px;gap:10px}.monthnav{display:flex;align-items:center;gap:12px}.monthnav strong{font-size:22px;min-width:130px}.navbtn{border:0;background:white;border-radius:10px;width:34px;height:34px;font-size:18px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.calendar{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekday{text-align:center;padding:12px 3px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}.weekday:first-child{color:#d16b68}
.day{min-height:122px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 6px;position:relative;min-width:0;cursor:pointer}.day:nth-child(7n){border-right:0}.day.other{background:#faf9f6}.day.today .num{background:var(--accent);color:white}.day.sunday .num{color:#d16b68}.num{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:12px;margin-bottom:5px}.other .num{color:#b8b5ae}
.rest{position:absolute;right:6px;top:10px;color:#d16b68;font-size:10px;background:#fff1ef;border-radius:6px;padding:2px 5px}.task{position:relative;margin:3px 0;padding:5px 18px 5px 7px;border-radius:6px;font-size:10px;line-height:1.35;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#252525;touch-action:pan-y;user-select:none;cursor:grab;border-left:3px solid var(--c)}
.task.done{opacity:.58;text-decoration:line-through}.task .grip{position:absolute;right:0;top:0;width:15px;height:100%;cursor:ew-resize;display:flex;align-items:center;justify-content:center;color:#555;font-size:12px;touch-action:none}.task.dragging{opacity:.35}.day.drop{background:#f0f2f8;outline:2px dashed #66708c;outline-offset:-3px}
.side{display:flex;flex-direction:column;gap:14px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}.panel h2{font-size:14px;margin:0 0 12px}.stat{display:flex;justify-content:space-between;font-size:13px;margin:9px 0}.stat b{font-size:15px}.hint{font-size:11px;color:var(--muted);line-height:1.65}.empty{font-size:12px;color:#aaa;text-align:center;padding:14px 0}
.bookrow,.savedrow{display:flex;align-items:center;gap:8px;font-size:12px;margin:8px 0;min-width:0}.bookrow .name,.savedrow .desc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bookrow button{margin-left:auto;border:0;background:#f5f3ef;border-radius:7px;padding:5px 8px;font-size:11px;flex-shrink:0}
.savedrow{align-items:flex-start;border-top:1px solid #f0eee9;padding-top:9px}.savedrow .desc{flex:1;white-space:normal;line-height:1.4}.savedrow .savedactions{display:flex;gap:4px;flex-shrink:0}
.modalback{position:fixed;inset:0;background:#17171766;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modalback.show{display:flex}.modal{background:white;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:20px;box-shadow:0 20px 70px #0003}.modal h2{margin:0 0 16px;font-size:18px}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:11px}.field{min-width:0}.field input,.field select{min-width:0;max-width:100%;display:block}.field input[type="date"],.field input[type="number"]{width:100%;min-width:0;min-height:42px}#duration{text-align:center}.checkrow{display:flex;align-items:center;gap:8px;font-size:12px}
.modalfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.rightbuttons{display:flex;gap:7px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#343c54;color:white;border-radius:10px;padding:11px 16px;font-size:12px;display:none;z-index:50;box-shadow:0 5px 20px #0002}
.goalrow{border-top:1px solid #f0eee9;padding:10px 0}.goalhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.goalbar{height:7px;background:#eee;border-radius:10px;overflow:hidden;margin:9px 0 5px}.goalbar span{display:block;height:100%;background:var(--goal-color,#7183b5);border-radius:10px}.goalmeta{font-size:10px;color:var(--muted);line-height:1.6}.monthbook{padding:8px 0;border-top:1px solid #f0eee9;font-size:12px}.monthbook small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.row-actions{display:flex;gap:4px;align-items:center}.tiny{border:0;background:#f4f2ee;border-radius:6px;padding:4px 7px;font-size:10px;color:#666}
.dateitem{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.dateitem .row-actions{flex-shrink:0}.done-date{color:#6d9b79}.muted-date{color:#aaa}
#bookChoices{display:none;position:absolute;z-index:5;background:white;border:1px solid var(--line);border-radius:10px;max-height:150px;overflow:auto;width:100%;box-shadow:0 5px 18px #0001}#bookChoices.show{display:block}.choice{padding:9px 11px;font-size:12px;cursor:pointer}.choice:hover{background:#f6f4ef}
@media(max-width:760px){.app{padding:15px 12px 35px}.layout{grid-template-columns:1fr}.side{display:flex}.day{min-height:85px;padding:5px 3px}.task{font-size:9px;padding:4px 13px 4px 5px}.monthnav strong{font-size:18px;min-width:110px}.formgrid{gap:8px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">SF</div><div><h1>STUDY FLOW</h1><div class="sub">나만의 공부 일정 관리</div></div></div>
  <div class="actions">
    <button class="btn small" id="undoBtn">↶ 되돌리기</button>
    <button class="btn small" id="redoBtn">↷ 다시 실행</button>
    <button class="btn small" id="settingsBtn">⚙ 설정</button>
    <button class="btn small" id="backup">백업</button>
    <button class="btn small" id="restoreBtn">복원</button>
    <input type="file" id="restoreFile" accept=".json" hidden>
  </div>
</header>
<div class="toolbar">
  <div class="monthnav"><button class="navbtn" id="prev">‹</button><strong id="monthTitle"></strong><button class="navbtn" id="next">›</button></div>
  <button class="btn small" id="todayBtn">오늘</button>
</div>
<div class="layout">
  <section class="calendar">
    <div class="weekdays"><div class="weekday">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday">토</div></div>
    <div class="days" id="days"></div>
  </section>
  <aside class="side">
    <section class="panel" id="statsPanel"><h2>이번 달 공부 현황</h2><div class="stat"><span>공부한 날짜</span><b id="taskCount">0일</b></div><div class="stat"><span>완료 일정</span><b id="doneCount">0개</b></div><div class="stat"><span>등록 문제집</span><b id="bookCount">0권</b></div><div id="monthDetails"></div></section>
    <section class="panel" id="savedPanel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">내 일정 보관함</h2><div class="panel-tools"><button class="btn small" id="savedEditBtn">편집</button><button class="btn small" id="savedMore">더보기</button></div></div><div id="savedList"></div></section>
    <section class="panel" id="goalPanel"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">회독 목표</h2><div class="panel-tools"><button class="btn small" id="addGoalBtn">+ 목표</button><button class="btn small" id="goalMore">더보기</button></div></div><div id="goalList"></div></section>
    <section class="panel" id="bookPanel"><h2>등록한 문제집</h2><div id="bookList"></div></section>
  </aside>
</div>
</div>

<div class="modalback" id="modalback"><div class="modal">
<h2 id="modalTitle">일정 추가</h2>
<div class="formgrid">
  <div class="field"><label>과목</label><select id="subject"><option>국어</option><option>영어</option><option>행정법</option><option>행정학</option><option>기타</option></select></div>
  <div class="field" style="position:relative"><label>문제집</label><input id="book" placeholder="문제집 이름 입력" autocomplete="off"><div id="bookChoices"></div></div>
  <div class="field"><label>시작일</label><input id="start" type="date"></div>
  <div class="field"><label>공부 기간(일)</label><input id="duration" type="number" min="1" max="365" value="3"></div>
  <div class="field"><label>공부 범위</label><input id="range" placeholder="예: 1~30번"></div>
  <div class="field"><label>일정 색상</label><input id="color" type="color" value="#f2b8b5"></div>
</div>
<div class="checkrow"><label><input id="excludeSunday" type="checkbox" checked> 일요일 제외</label><label><input id="showSubject" type="checkbox" checked> 과목 표시</label><label><input id="showBook" type="checkbox" checked> 문제집 표시</label><label><input id="showRange" type="checkbox" checked> 범위 표시</label></div>
<div class="field" style="margin-top:12px"><label>완료 상태</label><select id="done"><option value="false">미완료</option><option value="true">완료</option></select></div>
<div class="modalfoot"><button class="btn" id="deleteBtn" style="display:none">삭제</button><div class="rightbuttons"><button class="btn" id="cancelBtn">취소</button><button class="btn primary" id="saveBtn">저장</button></div></div>
</div></div>

<div class="modalback" id="dayBack"><div class="modal">
<h2 id="dayTitle">날짜 일정</h2><div id="dayItems"></div>
<div class="modalfoot"><button class="btn" id="deleteDayBtn">이 날짜 일정 모두 삭제</button><div class="rightbuttons"><button class="btn" id="dayClose">닫기</button><button class="btn primary" id="dayAdd">+ 일정 추가</button></div></div>
</div></div>

<div class="modalback" id="goalBack"><div class="modal">
<h2 id="goalModalTitle">회독 목표 설정</h2>
<div class="formgrid">
<div class="field"><label>과목</label><select id="goalSubject"><option>국어</option><option>영어</option><option>행정법</option><option>행정학</option><option>기타</option></select></div>
<div class="field"><label>문제집</label><input id="goalBook" placeholder="문제집 이름"></div>
<div class="field"><label>전체 단원 수</label><input id="goalUnits" type="number" min="1" value="6"></div>
<div class="field"><label>목표 회독 수</label><input id="goalRounds" type="number" min="1" value="5"></div>
<div class="field"><label>현재 회독</label><input id="goalCurrentRound" type="number" min="1" value="1"></div>
<div class="field"><label>현재 단원 / 범위</label><input id="goalCurrentUnit" type="text" inputmode="text" placeholder="예: 3단원, 행정행위, 15~20번"></div>
</div>
<div class="hint" style="margin-top:10px">예: 전체 6단원, 목표 5회독, 현재 2회독 6단원이면 2회독을 마친 상태로 계산해요. 다음은 3회독 1단원이에요.</div>
<div class="modalfoot"><button class="btn" id="deleteGoalBtn" style="display:none">목표 삭제</button><div class="rightbuttons"><button class="btn" id="cancelGoalBtn">취소</button><button class="btn primary" id="saveGoalBtn">저장</button></div></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
 9c9c9'};
let data={tasks:[],books:{},goals:{}},view=new Date(),editing=null,gesture=null,toastTimer=null,selectedDay=null,editingGoal=null;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{let d=fromISO(s);d.setDate(d.getDate()+n);return iso(d)};
let workEnd=(start,dur,excludeSunday=false)=>{let d=fromISO(start),count=0;while(count<Math.max(1,dur)){if(!excludeSunday||d.getDay()!==0)count++;if(count<Math.max(1,dur))d.setDate(d.getDate()+1)}return iso(d)};
let workCount=(a,b,excludeSunday=false)=>{let d=fromISO(a),e=fromISO(b),n=0;while(d<=e){if(!excludeSunday||d.getDay()!==0)n++;d.setDate(d.getDate()+1)}return n};
let isActive=(t,key)=>key>=t.start&&key<=t.end&&!(t.skipDates||[]).includes(key)&&!(t.excludeSunday&&fromISO(key).getDay()===0);
function bookKey(subject,book){return subject+'::'+book}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.tasks)){data={tasks:x.tasks.map(t=>({...t,skipDates:Array.isArray(t.skipDates)?t.skipDates:[],showSubject:t.showSubject!==false,showBook:t.showBook!==false,showRange:t.showRange!==false,excludeSunday:t.excludeSunday!==false})),books:x.books||{},goals:x.goals||{}};for(const [k,v] of Object.entries(data.books)){if(!k.includes('::')){let task=data.tasks.find(t=>t.book===k);let nk=bookKey(task?.subject||'기타',k);if(!data.books[nk])data.books[nk]=v;delete data.books[k]}}}}catch(e){}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function showToast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 $('monthTitle').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
 const first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
 const today=iso(new Date()),days=$('days');days.innerHTML='';
 for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),cell=document.createElement('div');cell.className='day'+(d.getMonth()!==view.getMonth()?' other':'')+(d.getDay()===0?' sunday':'')+(key===today?' today':'');cell.dataset.date=key;
 cell.innerHTML=`<div class="num">${d.getDate()}</div>${d.getDay()===0?'<span class="rest">휴식</span>':''}`;
 data.tasks.filter(t=>isActive(t,key)).forEach(t=>{let el=document.createElement('div');el.className='task'+(t.done?' done':'');el.style.setProperty('--c',t.color||palette[t.subject]||'#ccc');el.style.background=(t.color||palette[t.subject]||'#ccc')+'66';el.dataset.id=t.id;el.dataset.date=key;
 let labels=[];if(t.showSubject!==false)labels.push(esc(t.subject));if(t.showBook!==false&&t.book)labels.push(esc(t.book));let title=labels.join(' · ');if(t.showRange!==false&&t.range)title+=(title?' / ':'')+esc(t.range);el.innerHTML=`<span>${title||'일정'}</span>${key===t.end?'<span class="grip" title="기간 조절">⋮</span>':''}`;
 el.addEventListener('click',e=>{e.stopPropagation();if(!el.dataset.suppress)openEdit(t.id)});el.addEventListener('pointerdown',startGesture);cell.appendChild(el)});
 cell.addEventListener('click',()=>openDay(key));days.appendChild(cell)}
 const month=iso(new Date(view.getFullYear(),view.getMonth(),1)).slice(0,7);
 const monthStart=month+'-01',monthEnd=iso(new Date(view.getFullYear(),view.getMonth()+1,0));let activeDays=new Set(),monthly={};
 data.tasks.forEach(t=>{let d=t.start>monthStart?t.start:monthStart,end=t.end<monthEnd?t.end:monthEnd;while(d<=end){if(isActive(t,d)){activeDays.add(d);let k=bookKey(t.subject,t.book||'문제집 미입력');if(!monthly[k])monthly[k]={subject:t.subject,book:t.book||'문제집 미입력',days:new Set(),ranges:new Set()};monthly[k].days.add(d);if(t.range)monthly[k].ranges.add(t.range)}d=addDays(d,1)}});
 $('taskCount').textContent=activeDays.size+'일';$('doneCount').textContent=data.tasks.filter(t=>t.done&&t.start<=monthEnd&&t.end>=monthStart).length+'개';$('bookCount').textContent=Object.keys(monthly).length+'권';$('monthDetails').innerHTML=Object.values(monthly).length?Object.values(monthly).sort((a,b)=>a.subject.localeCompare(b.subject)).map(x=>`<div class="monthbook"><b>${esc(x.subject)} · ${esc(x.book)}</b><small>${x.days.size}일 공부 · 범위: ${esc([...x.ranges].join(', ')||'미입력')}</small></div>`).join(''):'이번 달 달력에 등록된 공부 기록이 없어요.';renderBooks();renderSaved();renderGoals();
}
function renderBooks(){let names=Object.keys(data.books);$('bookList').innerHTML=names.length?names.map(k=>{let [sub,name]=k.split('::');return `<div class="bookrow"><span class="dot" style="width:9px;height:9px;border-radius:3px;background:${data.books[k]}"></span><span class="name">${esc(sub)} · ${esc(name)}</span><button data-book="${esc(k)}">삭제</button></div>`}).join(''):'<div class="empty">저장된 문제집이 없습니다.</div>';
 $('bookList').querySelectorAll('button').forEach(b=>b.onclick=()=>{delete data.books[b.dataset.book];save();render();showToast('문제집 목록에서 삭제했어요.')})}
function renderSaved(){let arr=[...data.tasks].sort((a,b)=>b.start.localeCompare(a.start));$('savedList').innerHTML=arr.length?arr.map(t=>`<div class="savedrow"><div class="desc"><b>${esc(t.subject)} · ${esc(t.book||'문제집 미입력')}</b><br></div><div class="savedactions"><button class="btn small" data-reuse="${esc(t.id)}">다시 등록</button></div></div>`).join(''):'<div class="empty">등록한 일정이 여기에 저장돼요.</div>';
 $('savedList').querySelectorAll('[data-reuse]').forEach(b=>b.onclick=()=>reuseTask(b.dataset.reuse))}
function nextAvailableStart(){if(!data.tasks.length)return iso(new Date());let latest=data.tasks.reduce((m,t)=>t.end>m?t.end:m,data.tasks[0].end);let next=addDays(latest,1);return next}
function openNew(date=nextAvailableStart()){editing=null;$('modalTitle').textContent='일정 추가';$('deleteBtn').style.display='none';$('subject').value='국어';$('book').value='';$('start').value=date;$('duration').value=3;$('excludeSunday').checked=true;$('range').value='';$('showSubject').checked=true;$('showBook').checked=true;$('showRange').checked=true;$('color').value=palette.국어;$('done').value='false';$('bookChoices').classList.remove('show');$('modalback').classList.add('show')}
function openEdit(id){let t=data.tasks.find(x=>x.id===id);if(!t)return;editing=id;$('modalTitle').textContent='일정 수정';$('deleteBtn').style.display='block';$('subject').value=t.subject;$('book').value=t.book||'';$('start').value=t.start;$('duration').value=t.duration||workCount(t.start,t.end,!!t.excludeSunday);$('excludeSunday').checked=t.excludeSunday!==false;$('range').value=t.range||'';$('showSubject').checked=t.showSubject!==false;$('showBook').checked=t.showBook!==false;$('showRange').checked=t.showRange!==false;$('color').value=t.color||palette[t.subject]||'#cccccc';$('done').value=String(!!t.done);$('bookChoices').classList.remove('show');$('modalback').classList.add('show')}

  $('pageColor').addEventListener('input',e=>{data.settings.pageColor=e.target.value;applyTheme();save()});
  $('settingsReset').onclick=()=>{
    if(!confirm('패널 표시와 순서, 배경색을 기본값으로 되돌릴까요?'))return;
    data.settings.pageColor='#f6f4ef';data.settings.panelOrder=defaults.slice();data.settings.panelVisibility={};applyTheme();applyPanelConfig();makePanelSettings();$('pageColor').value='#f6f4ef';save();showToast('설정을 초기화했어요.');
  };

  // Sortable active schedules (one shown by default).
  window.renderCurrent=function(){
    const order=data.settings.taskOrder||[];
    const all=[...data.tasks].sort((a,b)=>{const ia=order.indexOf(a.id),ib=order.indexOf(b.id);if(ia<0&&ib<0)return a.start.localeCompare(b.start);return (ia<0?99999:ia)-(ib<0?99999:ib)});
    const shown=currentExpanded?all:all.slice(0,1);
    $('currentList').innerHTML=shown.length?shown.map(t=>`<div class="savedrow sortable-row" data-sort-id="${esc(t.id)}"><button class="drag-handle" type="button" aria-label="일정 순서 이동">⠿</button><div class="desc"><b>${esc(t.subject)} · ${esc(t.book||'문제집 미입력')}</b><br><span class="hint">${esc(t.start)} ~ ${esc(t.end)} · ${t.duration||1}일</span></div><div class="savedactions"><button class="btn small" data-edit="${esc(t.id)}">수정</button>${currentEditing?`<button class="tiny" data-task-del="${esc(t.id)}">삭제</button>`:''}</div></div>`).join(''):'<div class="empty">현재 적용 중인 일정이 없습니다.</div>';
    $('currentList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
    $('currentList').querySelectorAll('[data-task-del]').forEach(b=>b.onclick=()=>{if(!confirm('이 일정을 삭제할까요?'))return;data.tasks=data.tasks.filter(t=>t.id!==b.dataset.taskDel);save();render()});
    enablePointerSort($('currentList'),'.sortable-row',rows=>{const visible=rows.map(x=>x.dataset.sortId),rest=(data.settings.taskOrder||[]).filter(id=>!visible.includes(id));data.settings.taskOrder=[...visible,...rest];save()});
    $('currentMore').textContent=currentExpanded?'접기':'더보기';$('currentEditBtn').textContent=currentEditing?'편집 완료':'편집';
  };

  // Grouped archive: default rows intentionally omit range and duration.
  window.renderSaved=function(){
    const map=new Map();data.tasks.forEach(t=>{const k=bookKey(t.subject,t.book||'문제집 미입력');if(!map.has(k))map.set(k,{subject:t.subject,book:t.book||'문제집 미입력',items:[]});map.get(k).items.push(t)});
    let arr=[...map.entries()].filter(([k])=>!(data.hiddenSaved||[]).includes(k));const order=data.settings.savedOrder||[];
    arr.sort((a,b)=>{const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);if(ia<0&&ib<0)return a[0].localeCompare(b[0]);return (ia<0?99999:ia)-(ib<0?99999:ib)});
    const shown=savedExpanded?arr:arr.slice(0,3);
    $('savedList').innerHTML=shown.length?shown.map(([k,g])=>`<div class="savedrow sortable-row" data-sort-id="${esc(k)}"><button class="drag-handle" type="button" aria-label="보관함 순서 이동">⠿</button><div class="desc"><b>${esc(g.subject)} · ${esc(g.book)}</b></div><div class="savedactions"><button class="btn small" data-group="${esc(k)}">바로 등록</button>${savedEditing?`<button class="tiny" data-group-hide="${esc(k)}">삭제</button>`:''}</div></div>`).join(''):'<div class="empty">등록한 일정이 없습니다.</div>';
    $('savedList').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const t=data.tasks.find(x=>bookKey(x.subject,x.book||'문제집 미입력')===b.dataset.group);if(t)reuseTask(t.id)});
    $('savedList').querySelectorAll('[data-group-hide]').forEach(b=>b.onclick=()=>{if(!confirm('이 그룹을 보관함에서만 삭제할까요? 기존 일정은 유지돼요.'))return;data.hiddenSaved=data.hiddenSaved||[];data.hiddenSaved.push(b.dataset.groupHide);save();renderSaved()});
    enablePointerSort($('savedList'),'.sortable-row',rows=>{const visible=rows.map(x=>x.dataset.sortId),rest=(data.settings.savedOrder||[]).filter(id=>!visible.includes(id));data.settings.savedOrder=[...visible,...rest];save()});
    $('savedMore').textContent=savedExpanded?'접기':'더보기';$('savedEditBtn').textContent=savedEditing?'편집 완료':'편집';
  };

  // Goals accept free text such as "3단원", "행정행위", or "15~20번".
  window.openGoal=function(key=null){
    editingGoal=key;const g=key?data.goals[key]:null;
    $('goalModalTitle').textContent=g?'회독 목표 및 진도 수정':'회독 목표 설정';$('deleteGoalBtn').style.display=g?'block':'none';
    $('goalSubject').value=g?.subject||'행정법';$('goalBook').value=g?.book||'';$('goalUnits').value=g?.units||6;$('goalRounds').value=g?.rounds||5;$('goalCurrentRound').value=g?.currentRound||1;$('goalCurrentUnit').value=g?.currentUnit??'0단원';
    $('goalColor').value=g?.color||palette[$('goalSubject').value]||'#7183b5';$('goalBack').classList.add('show');
  };
  window.renderGoals=function(){
    let entries=Object.entries(data.goals||{}),order=data.settings.goalOrder||[];
    entries.sort((a,b)=>{const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);if(ia<0&&ib<0)return a[0].localeCompare(b[0]);return (ia<0?99999:ia)-(ib<0?99999:ib)});
    const shown=goalExpanded?entries:entries.slice(0,3);
    $('goalList').innerHTML=shown.length?shown.map(([k,g])=>{
      const total=Math.max(1,Number(g.units)||1),target=Math.max(1,Number(g.rounds)||1),r=Math.max(1,Number(g.currentRound)||1);
      const raw=String(g.currentUnit??'0단원'),unitNumber=Math.max(0,Math.min(total,parseInt(raw.match(/\d+/)?.[0]||'0',10)||0));
      const done=Math.min(target*total,Math.max(0,(r-1)*total+unitNumber)),pct=Math.round(done/(target*total)*100);
      return `<div class="goalrow sortable-row" data-sort-id="${esc(k)}" style="--goal-color:${g.color||palette[g.subject]||'#7183b5'}"><div class="goalhead"><span style="display:flex;align-items:center;gap:7px"><button class="drag-handle" type="button" aria-label="목표 순서 이동">⠿</button><b>${esc(g.subject)} · ${esc(g.book)}</b></span><button class="btn small" data-editgoal="${esc(k)}">수정</button></div><div class="goalbar"><span style="width:${pct}%"></span></div><div class="goalmeta">현재 ${r}회독 ${esc(raw)} · 목표 ${target}회독 · ${pct}%</div></div>`;
    }).join(''):'<div class="empty">문제집별 회독 목표를 설정할 수 있어요.</div>';
    $('goalList').querySelectorAll('[data-editgoal]').forEach(b=>b.onclick=()=>openGoal(b.dataset.editgoal));
    enablePointerSort($('goalList'),'.sortable-row',rows=>{const visible=rows.map(x=>x.dataset.sortId),rest=(data.settings.goalOrder||[]).filter(id=>!visible.includes(id));data.settings.goalOrder=[...visible,...rest];const old=data.goals;data.goals=Object.fromEntries([...visible,...rest].filter(k=>old[k]).map(k=>[k,old[k]]));save()});
    $('goalMore').textContent=goalExpanded?'접기':'더보기';
  };
  $('saveGoalBtn').onclick=()=>{
    const subject=$('goalSubject').value,book=$('goalBook').value.trim(),units=Math.max(1,Number($('goalUnits').value)||1),rounds=Math.max(1,Number($('goalRounds').value)||1),currentRound=Math.max(1,Number($('goalCurrentRound').value)||1),currentUnit=$('goalCurrentUnit').value.trim()||'0단원';
    if(!book){showToast('문제집 이름을 입력해 주세요.');return}
    const key=bookKey(subject,book);data.goals[key]={...(data.goals[key]||{}),subject,book,units,rounds,currentRound,currentUnit,color:$('goalColor').value};
    data.books[key]=data.books[key]||palette[subject]||'#ccc';data.hiddenBooks=(data.hiddenBooks||[]).filter(x=>x!==key);data.hiddenSaved=(data.hiddenSaved||[]).filter(x=>x!==key);
    save();$('goalBack').classList.remove('show');render();showToast('회독 목표를 저장했어요.');
  };

  // Book list with drag sorting and persistent hide behavior.
  window.renderBooks=function(){
    const keys=allBookKeys(),order=data.settings.bookOrder||[];
    keys.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);if(ia<0&&ib<0)return a.localeCompare(b);return (ia<0?99999:ia)-(ib<0?99999:ib)});
    const shown=bookExpanded?keys:keys.slice(0,3);
    $('bookList').innerHTML=shown.length?shown.map(k=>{const [sub,name]=k.split('::');return `<div class="bookrow sortable-row" data-sort-id="${esc(k)}"><button class="drag-handle" type="button" aria-label="교재 순서 이동">⠿</button><span class="name">${esc(sub)} · ${esc(name)}</span><button data-hidebook="${esc(k)}">목록 삭제</button></div>`}).join(''):'<div class="empty">저장된 문제집이 없습니다.</div>';
    $('bookList').querySelectorAll('[data-hidebook]').forEach(b=>b.onclick=()=>{const k=b.dataset.hidebook;if(!confirm('문제집 목록에서만 삭제할까요? 기존 일정과 회독 목표는 유지돼요.'))return;data.hiddenBooks=data.hiddenBooks||[];data.hiddenBooks.push(k);save();render();showToast('문제집 목록에서 숨겼어요.')});
    enablePointerSort($('bookList'),'.sortable-row',rows=>{const visible=rows.map(x=>x.dataset.sortId),rest=(data.settings.bookOrder||[]).filter(id=>!visible.includes(id));data.settings.bookOrder=[...visible,...rest];save()});
  };

  // Default three books, with expand/collapse control.
  if(!$('bookMore')){const b=document.createElement('button');b.id='bookMore';b.className='btn small';b.textContent='더보기';$('bookPanel').querySelector('h2').insertAdjacentElement('afterend',b);}
  $('bookMore').onclick=()=>{bookExpanded=!bookExpanded;renderBooks();$('bookMore').textContent=bookExpanded?'접기':'더보기'};
  $('bookPanel').querySelector('h2').style.display='inline-block';
  let bookExpanded=false;

  // Update panel settings after the DOM panels have been created.
  applyTheme();applyPanelConfig();
  const oldRender=render;
  render=function(){oldRender();renderCurrent();renderSaved();renderBooks();renderGoals();renderStats();applyTheme();applyPanelConfig()};
  render();
})();
</script>
</body></html>
